# Selftest fixture for scripts/guards/check-ci-gate.mjs: no top-level permissions,
# one job without its own block (inherits the repo default token, which may
# include checks: write) and one job with permissions: write-all.
name: Other

on:
  push:
    branches: [main]

jobs:
  inherits:
    name: Inherits the default token
    runs-on: ubuntu-latest
    steps:
      - run: echo default scope

  everything:
    name: Write all
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - run: echo write-all
