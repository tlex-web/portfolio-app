# Selftest fixture for scripts/guards/check-ci-gate.mjs: unit-tests carries the
# docs-only condition but is missing from the IN(...) list in this fixture's
# scripts/ci/ci-ok.jq, so a docs-only run would skip it and CI OK would fail.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    timeout-minutes: 5
    steps:
      - id: classify
        run: echo "docs_only=false" >> "$GITHUB_OUTPUT"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 5
    steps:
      - run: echo test

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [changes, unit-tests]
    if: needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 5
    steps:
      - run: echo build

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, unit-tests, build]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
      - name: Every needed job passed or skipped on purpose
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: printf '%s\n' "$NEEDS" | jq -e --arg event "$EVENT" -f scripts/ci/ci-ok.jq
