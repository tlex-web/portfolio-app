version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    reviewers:
      - "tlex-web"
    assignees:
      - "tlex-web"
    # Group minor and patch updates together
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    # Ignore specific packages if needed
    ignore:
      # Major version updates for these packages require manual review
      - dependency-name: "next" # Phase 7 hold: restore update-types ["version-update:semver-major"] at phase close
      - dependency-name: "react" # Phase 7 hold: restore update-types ["version-update:semver-major"] at phase close
      - dependency-name: "react-dom" # Phase 7 hold: restore update-types ["version-update:semver-major"] at phase close
      # Phase 7 temporary holds: remove at phase close (plan 07-26)
      - dependency-name: "motion"
      - dependency-name: "framer-motion"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      - dependency-name: "@react-three/fiber"
      - dependency-name: "@react-three/drei"
      - dependency-name: "@playwright/test"
      - dependency-name: "eslint-config-next"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "github-actions"
      - "automated"
