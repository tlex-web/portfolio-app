name: Update visual baselines

# Generates Linux screenshot baselines (GUARD-02) in the official Playwright
# container and uploads them as an artifact. It never writes to the repo:
# Tim downloads, reviews and commits the PNGs by hand (e2e/visual/README.md).

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run'
        type: choice
        options: [visual, perf]
        default: visual
      update_mode:
        description: 'Playwright --update-snapshots mode'
        type: choice
        options: [changed, all]
        default: changed

permissions:
  contents: read

jobs:
  update:
    name: Update baselines
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The tag must equal the lockfile @playwright/test version
    # (enforced by scripts/guards/check-install-parity.mjs).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify lockfile install
        run: npm ls --depth=0

      # Inputs reach the shell only through env, never through ${{ }} in run.
      - name: Generate visual baselines
        if: inputs.suite == 'visual'
        run: npx playwright test --project=visual-dark --project=visual-light --update-snapshots="$UPDATE_MODE"
        env:
          UPDATE_MODE: ${{ inputs.update_mode }}
          CI: '1'
          RESEND_API_KEY: dummy_key_for_tests
          FEEDBACK_RECIPIENT_EMAIL: test@example.com
          FEEDBACK_FROM_EMAIL: noreply@example.com

      # The perf project arrives in plan 07-26.
      - name: Record Home performance baseline
        if: inputs.suite == 'perf'
        run: npx playwright test --project=perf
        env:
          CI: '1'
          RESEND_API_KEY: dummy_key_for_tests
          FEEDBACK_RECIPIENT_EMAIL: test@example.com
          FEEDBACK_FROM_EMAIL: noreply@example.com

      - name: Upload visual baselines
        uses: actions/upload-artifact@v7
        if: always() && inputs.suite == 'visual'
        with:
          name: visual-baselines
          path: e2e/visual/routes.spec.ts-snapshots/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Home performance baseline
        uses: actions/upload-artifact@v7
        if: always() && inputs.suite == 'perf'
        with:
          name: home-baseline
          path: test-results/home-baseline.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
